name: Deploy CyberGuard to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find CyberGuard ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: CyberGuard ZIP not found."
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract CyberGuard
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "${{ steps.zip.outputs.zip_file }}" -d extracted

      - name: Locate project
        id: project
        shell: bash
        run: |
          set -e

          PACKAGE_JSON=$(find extracted \
            -type f \
            -name "package.json" \
            -not -path "*/node_modules/*" \
            | head -n 1)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_JSON")

          echo "Project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: TypeScript check
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: npx tsc -b

      - name: Build CyberGuard
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          VITE_SUPABASE_URL: "https://zudcznegxuewkuffzhug.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_-0C-3URXKp1aIXQ-3HTnwA_DbMXHDLZ"
          VITE_BASE_PATH: "/${{ github.event.repository.name }}/"
        run: npm run build

      - name: Verify build
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -e

          test -d dist
          test -f dist/index.html

          echo "CyberGuard build successful."
          echo "Base path:"
          grep -o "/${{ github.event.repository.name }}/" dist/index.html | head -1 || true

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.project.outputs.project_dir }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
